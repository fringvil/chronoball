<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CHRONOBALL</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #070812;
      --panel: rgba(11, 15, 30, 0.82);
      --cyan: #00ffcc;
      --pink: #ff176f;
      --line: rgba(0, 255, 204, 0.2);
    }
    * { box-sizing: border-box; user-select: none; touch-action: none; }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 50% 42%, #182040 0, #080b18 32%, #020207 78%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    }
    #game {
      position: relative;
      width: min(100vw, 450px);
      height: min(100vh, 800px);
      overflow: hidden;
      background: var(--ink);
      border: 1px solid rgba(0, 255, 204, 0.32);
      border-radius: 18px;
      box-shadow: 0 0 0 1px rgba(255, 23, 111, 0.12), 0 0 38px rgba(255, 23, 111, 0.28), 0 24px 80px rgba(0, 0, 0, 0.65);
    }
    #game::before, #game::after {
      content: '';
      position: absolute;
      z-index: 2;
      pointer-events: none;
    }
    #game::before {
      inset: 0;
      background: linear-gradient(115deg, transparent 0 48%, rgba(0, 255, 204, 0.035) 50%, transparent 52%), repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 5px);
      mix-blend-mode: screen;
    }
    #game::after {
      top: 12px;
      left: 50%;
      width: 54px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: var(--pink);
      box-shadow: 0 0 12px var(--pink);
    }
    canvas { display: block; }
    #gameOverModal {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 10;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 28px;
      color: #fff;
      background: rgba(4, 5, 15, 0.88);
      backdrop-filter: blur(10px);
      text-align: center;
    }
    #introModal {
      display: flex;
      position: absolute;
      inset: 0;
      z-index: 10;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: clamp(40px, 9vh, 72px) 20px 28px;
      color: #fff;
      background: radial-gradient(circle at 50% 18%, rgba(0, 255, 204, 0.08), transparent 35%), rgba(4, 5, 15, 0.88);
      backdrop-filter: blur(10px);
      text-align: center;
      overflow-y: auto;
    }
    #introModal > * { position: relative; }
    .intro-kicker { margin: 0 0 9px; color: var(--cyan); font-size: 10px; font-weight: 700; letter-spacing: 3px; }
    #introModal h1 { max-width: 100%; margin: 0; color: #fff; font-size: clamp(30px, 10vw, 42px); letter-spacing: clamp(2px, 0.8vw, 4px); line-height: 1; overflow-wrap: anywhere; text-shadow: 0 0 20px var(--cyan), 4px 0 0 rgba(255, 23, 111, 0.55); }
    .intro-subtitle { max-width: 270px; margin: 13px 0 20px; color: rgba(255, 255, 255, 0.62); font-size: 12px; line-height: 1.45; letter-spacing: 0.3px; }
    .menu-section-title { align-self: center; width: min(100%, 280px); margin: 0 0 9px; color: rgba(255, 255, 255, 0.45); font-size: 10px; font-weight: 700; letter-spacing: 2px; text-align: left; }
    .control-list { display: grid; gap: 7px; width: min(100%, 300px); margin-bottom: 18px; }
    .control-row { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 10px 11px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; background: rgba(11, 15, 30, 0.8); text-align: left; }
    .control-key { flex: 0 0 64px; padding: 5px 4px; border: 1px solid rgba(0, 255, 204, 0.42); border-radius: 5px; color: var(--cyan); font-size: 10px; font-weight: 700; letter-spacing: 1px; text-align: center; }
    .control-key.wide { flex-basis: 104px; }
    .control-row:last-child .control-key { border-color: rgba(255, 23, 111, 0.5); color: var(--pink); }
    .control-label { min-width: 0; color: rgba(255, 255, 255, 0.85); font-size: 12px; line-height: 1.25; letter-spacing: 0.5px; overflow-wrap: anywhere; }
    #gameOverModal::before {
      content: '';
      position: absolute;
      inset: 18% 9%;
      border: 1px solid rgba(255, 23, 111, 0.35);
      border-radius: 14px;
      box-shadow: inset 0 0 35px rgba(255, 23, 111, 0.08), 0 0 30px rgba(0, 255, 204, 0.08);
      pointer-events: none;
    }
    #gameOverModal > * { position: relative; }
    #gameOverModal h1 { margin: 0 0 12px; color: var(--pink); font-size: clamp(24px, 8vw, 32px); letter-spacing: 3px; text-shadow: 0 0 18px var(--pink); }
    #gameOverModal p { margin: 0 0 18px; color: rgba(255, 255, 255, 0.7); font-size: 13px; letter-spacing: 1px; }
    #finalScore { color: var(--cyan); font-size: 20px; font-weight: 700; text-shadow: 0 0 12px var(--cyan); }
    .game-button { width: min(100%, 280px); margin: 7px; padding: 15px 20px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: #fff; background: linear-gradient(135deg, #ff176f, #ff4d38); font: 700 12px 'Trebuchet MS', sans-serif; letter-spacing: 1.5px; cursor: pointer; pointer-events: auto; touch-action: manipulation; box-shadow: 0 8px 22px rgba(255, 23, 111, 0.22); transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease; }
    .game-button:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 11px 28px rgba(255, 23, 111, 0.34); }
    .game-button:active { transform: translateY(1px); }
    #reviveButton { color: #031214; background: linear-gradient(135deg, var(--cyan), #39b9ff); box-shadow: 0 8px 22px rgba(0, 255, 204, 0.2); }
    @media (max-width: 450px) { #game { border-radius: 0; border-left: 0; border-right: 0; } }
    @media (max-height: 700px) { #introModal { padding-top: 28px; padding-bottom: 18px; } .intro-subtitle { margin-bottom: 14px; } .control-list { gap: 6px; margin-bottom: 14px; } }
  </style>
</head>
<body>
  <div id="game">
    <div id="introModal">
      <p class="intro-kicker">NEON TIMELINE // READY</p>
      <h1>CHRONOBALL</h1>
      <p class="intro-subtitle">Survive the falling gates, stay in motion, and slice through anything you cannot avoid.</p>
      <p class="menu-section-title">HOW TO PLAY</p>
      <div class="control-list">
        <div class="control-row"><span class="control-key wide">WASD / ARROWS</span><span class="control-label">Move the ball</span></div>
        <div class="control-row"><span class="control-key">SPACE</span><span class="control-label">Activate neon slash</span></div>
        <div class="control-row"><span class="control-key">TOUCH</span><span class="control-label">Drag anywhere to move</span></div>
      </div>
      <button id="startButton" class="game-button">BEGIN TIMELINE</button>
    </div>
    <div id="gameOverModal">
      <h1>TIMELINE SHATTERED</h1>
      <p>Depth Reached: <span id="finalScore">0</span>m</p>
      <button id="reviveButton" class="game-button">REWIND TIME (REVIVE)</button>
      <button id="restartButton" class="game-button">NEW TIMELINE</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
